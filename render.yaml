services:
  - type: web
    name: hatchloop-aeo
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: shopify
      - key: DATABASE_URL
        value: file:/data/sqlite.db
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: aeo-data
      mountPath: /data
      sizeGB: 1
