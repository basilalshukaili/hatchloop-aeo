services:
  - type: web
    name: hatchloop-aeo
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: shopify
      - key: DATABASE_URL
        value: file:./prisma/prod.db
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
