<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="1200" height="1200" rx="240" ry="240" fill="url(#bg)" />

  <!-- Subtle inner glow -->
  <rect width="1200" height="1200" rx="240" ry="240" fill="white" opacity="0.06" />

  <!-- Central sparkle star (4-point) -->
  <!-- Vertical bar of sparkle -->
  <ellipse cx="600" cy="600" rx="52" ry="260" fill="url(#spark)" />
  <!-- Horizontal bar -->
  <ellipse cx="600" cy="600" rx="260" ry="52" fill="url(#spark)" />
  <!-- Diagonal 1 (45 deg) -->
  <ellipse cx="600" cy="600" rx="36" ry="185" fill="url(#spark)" transform="rotate(45 600 600)" />
  <!-- Diagonal 2 (135 deg) -->
  <ellipse cx="600" cy="600" rx="36" ry="185" fill="url(#spark)" transform="rotate(-45 600 600)" />

  <!-- Center circle (bright core) -->
  <circle cx="600" cy="600" r="72" fill="white" />

  <!-- Small accent sparkle top-right -->
  <ellipse cx="840" cy="340" rx="18" ry="72" fill="white" opacity="0.7" />
  <ellipse cx="840" cy="340" rx="72" ry="18" fill="white" opacity="0.7" />

  <!-- Small accent sparkle bottom-left -->
  <ellipse cx="360" cy="860" rx="14" ry="56" fill="white" opacity="0.5" />
  <ellipse cx="360" cy="860" rx="56" ry="14" fill="white" opacity="0.5" />
</svg>
