# Theme App Extension config for Hatchloop AEO schema injection block.
# This extension injects JSON-LD cleanly without modifying theme code.
# It is removed automatically on app uninstall.

api_version = "2026-01"

[[extensions]]
type = "theme"
name = "Hatchloop AEO Schema"
handle = "hatchloop-aeo-schema"

  [extensions.development]
    root_dir = "."
